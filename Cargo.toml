[package]
name = "mini-todo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0", features = ["formatting", "local-offset", "macros"] }

[dev-dependencies]
tempfile = "3"
